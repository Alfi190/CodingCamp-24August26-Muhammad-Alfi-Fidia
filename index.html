<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Life Dashboard</title>
  <!-- Google Fonts for premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <noscript>
    <div class="noscript-banner">
      <p>JavaScript is required to use the Todo Life Dashboard. Please enable JavaScript in your browser to experience this interactive workspace.</p>
    </div>
  </noscript>

  <!-- Main App Shell -->
  <div class="app-shell">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="logo-area">
        <h1>Todo Life Dashboard</h1>
      </div>
      <div class="clock-date-area">
        <div id="clock" class="clock-display" aria-live="polite">00:00:00</div>
        <div id="date" class="date-display">Monday, 01 January 1970</div>
      </div>
      <div class="theme-area">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Switch to dark theme">🌙</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      
      <!-- Greeting Banner -->
      <section class="greeting-banner">
        <div class="greeting-text-container">
          <h2 id="greeting">Hello!</h2>
        </div>
        <div class="name-custom-container">
          <div class="input-group">
            <input type="text" id="name-input" placeholder="Enter your name..." aria-label="Your Name" maxlength="50" autocomplete="off" />
            <button id="name-submit" class="btn">Save Name</button>
          </div>
        </div>
      </section>

      <!-- Widgets Grid -->
      <div class="widgets-grid">
        
        <!-- Pomodoro Timer Widget -->
        <section id="timer-container" class="widget-card">
          <div class="widget-header">
            <h3>⏱️ Focus Timer</h3>
            <div class="duration-input-container">
              <label for="timer-duration">Duration:</label>
              <input type="number" id="timer-duration" min="1" max="60" value="25" aria-label="Timer Duration (Minutes)" />
              <span class="unit">min</span>
            </div>
          </div>
          <div class="widget-body timer-body">
            <div id="timer-display" class="timer-display-text">25:00</div>
            <div class="timer-controls">
              <button id="timer-start" class="btn btn-success">Start</button>
              <button id="timer-stop" class="btn btn-warning" disabled>Stop</button>
              <button id="timer-reset" class="btn btn-danger">Reset</button>
            </div>
          </div>
        </section>

        <!-- Tasks Widget -->
        <section id="todo-container" class="widget-card">
          <div class="widget-header">
            <h3>📝 Daily Tasks</h3>
          </div>
          <div class="widget-body todo-body">
            <div id="task-input-container" class="input-action-group">
              <input type="text" id="task-input" placeholder="What needs to be done?" aria-label="New Task Description" maxlength="500" autocomplete="off" />
              <button id="task-add" class="btn">Add Task</button>
            </div>
            <ul id="task-list" class="task-list-element">
              <!-- Rendered dynamically -->
            </ul>
          </div>
        </section>

        <!-- Quick Links Widget -->
        <section id="quicklinks-container" class="widget-card">
          <div class="widget-header">
            <h3>🔗 Quick Links</h3>
          </div>
          <div class="widget-body links-body">
            <div id="link-input-container" class="link-inputs">
              <div class="input-row">
                <input type="text" id="link-label" placeholder="Link Label (e.g. Google)" aria-label="Link Label" maxlength="50" autocomplete="off" />
              </div>
              <div class="input-row">
                <input type="url" id="link-url" placeholder="URL (must start with http:// or https://)" aria-label="Link URL" maxlength="2048" autocomplete="off" />
              </div>
              <button id="link-add" class="btn btn-full">Add Link</button>
              <p id="links-cap-message" class="cap-message" hidden></p>
            </div>
            <div id="links-container" class="links-grid">
              <!-- Rendered dynamically -->
            </div>
          </div>
        </section>

      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Single Page Focus Application &bull; Pure Client-Side Persistence</p>
    </footer>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
